name: Auto-fix Lint Errors

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main, develop]

concurrency:
  group: auto-fix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  auto-fix:
    name: Auto-fix Lint & Format
    runs-on: ubuntu-latest
    # Don't run on dependabot PRs or auto-fix commits
    if: |
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.head_commit.message, '[auto-fix]')
    
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome format (auto-fix)
        run: bun run format
        continue-on-error: true

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit fixes
        if: steps.changes.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: [auto-fix] apply biome formatting

          Automatic fixes applied by CI/CD pipeline.
          
          Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push

      - name: Add comment on PR
        if: steps.changes.outputs.changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 **Auto-fix Applied**\n\nBiome formatting has been automatically applied to this PR.\n\nPlease pull the latest changes before making further edits.'
            })
