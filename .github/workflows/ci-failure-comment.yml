name: CI Failure Comment

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  comment-on-failure:
    name: Post Error Details to PR
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    
    permissions:
      pull-requests: write
      actions: read

    steps:
      - name: Get PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const workflowRun = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            
            // Get PR associated with the workflow run
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${workflowRun.data.head_branch}`,
              state: 'open',
            });
            
            if (prs.data.length > 0) {
              core.setOutput('number', prs.data[0].number);
              return prs.data[0].number;
            }
            return null;

      - name: Get failed jobs
        id: jobs
        if: steps.pr.outputs.number
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            
            const failedJobs = jobs.data.jobs.filter(job => job.conclusion === 'failure');
            
            let errorDetails = '';
            for (const job of failedJobs) {
              errorDetails += `### ❌ ${job.name}\n\n`;
              
              // Get job logs (last 100 lines)
              try {
                const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  job_id: job.id,
                });
                
                const logLines = logs.data.split('\n');
                const lastLines = logLines.slice(-100).join('\n');
                
                // Extract error patterns
                const errorPattern = /(error|Error|ERROR|failed|Failed|FAILED).*$/gm;
                const errors = lastLines.match(errorPattern) || [];
                
                if (errors.length > 0) {
                  errorDetails += '```\n' + errors.slice(0, 20).join('\n') + '\n```\n\n';
                } else {
                  errorDetails += '```\n' + lastLines.slice(-2000) + '\n```\n\n';
                }
              } catch (e) {
                errorDetails += '_Could not retrieve job logs_\n\n';
              }
            }
            
            core.setOutput('details', errorDetails);
            return errorDetails;

      - name: Post comment on PR
        if: steps.pr.outputs.number && steps.jobs.outputs.details
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.payload.workflow_run.id}`;
            
            const body = `## 🔴 CI Failed
            
            The CI pipeline failed for this PR. Here are the details:
            
            **Workflow Run:** [View Details](${runUrl})
            **Branch:** \`${context.payload.workflow_run.head_branch}\`
            **Commit:** \`${context.payload.workflow_run.head_sha.substring(0, 7)}\`
            
            ${{ steps.jobs.outputs.details }}
            
            ---
            
            <details>
            <summary>💡 Common fixes</summary>
            
            **Lint errors:**
            \`\`\`bash
            bun run format  # Auto-fix formatting
            bun run lint    # Check remaining issues
            \`\`\`
            
            **Type errors:**
            \`\`\`bash
            bun run typecheck  # Check type errors
            \`\`\`
            
            **Test failures:**
            \`\`\`bash
            bun test          # Run unit tests
            bun run test:e2e  # Run E2E tests
            \`\`\`
            
            </details>
            `;
            
            // Find existing comment to update
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            const existingComment = comments.data.find(
              c => c.user?.login === 'github-actions[bot]' && c.body?.includes('## 🔴 CI Failed')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
            }
